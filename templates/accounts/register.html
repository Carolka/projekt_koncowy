<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Rejestracja - Katalog biblioteczny</title>
</head>

<body>
    <main>
        <h1>Rejestracja</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Zarejestruj się</button>
        </form>
        <p>Masz już konto?
            <a href="{% url 'login' %}"> Zaloguj się </a>
        </p>
    </main>
</body>

</html>
