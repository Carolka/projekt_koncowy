<text x="1200" y="850" font-size="17" font-weight="bold">Legenda i zakres</text>
<text x="1200" y="876" font-size="13">PK — klucz główny; FK — klucz obcy</text>
<text x="1200" y="895" font-size="13">UK — unikalność; ? — dopuszczalne NULL</text>
<text x="1200" y="914" font-size="13">Pozostałe kolumny: NOT NULL</text>
<text x="1200" y="933" font-size="13">1 : N — jeden rekord do wielu rekordów</text>
<text x="1200" y="952" font-size="13">Tabele auth grup i uprawnień, sesji,</text>
<text x="1200" y="971" font-size="13">admina i migracji pominięto.</text>
<text x="1200" y="1090" font-size="17" font-weight="bold">Indeksy rezerwacji</text>
<text x="1200" y="1116" font-size="13">rez_status_odbior_idx:</text>
<text x="1200" y="1135" font-size="13">(status, termin_odbioru)</text>
<text x="1200" y="1154" font-size="13">rez_status_zwrot_idx:</text>
<text x="1200" y="1173" font-size="13">(status, termin_zwrotu)</text>
<text x="1200" y="1192" font-size="13">Klucze obce mają indeksy Django.</text>
<text x="1200" y="1310" font-size="17" font-weight="bold">Ograniczenia rezerwacji</text>
<text x="1200" y="1336" font-size="13">jedna_aktywna_rez_na_egz:</text>
<text x="1200" y="1355" font-size="13">UNIQUE (egzemplarz_id) WHERE</text>
<text x="1200" y="1374" font-size="13">status IN (OCZEKUJACA, ODEBRANA)</text>
<text x="1200" y="1393" font-size="13"></text>
<text x="1200" y="1412" font-size="13">odbior_po_utworzeniu:</text>
<text x="1200" y="1431" font-size="13">termin_odbioru &gt; utworzona_at</text>
<text x="1200" y="1450" font-size="13"></text>
<text x="1200" y="1469" font-size="13">poprawny_termin_zwrotu:</text>
<text x="1200" y="1488" font-size="13">odebrana_at i termin_zwrotu oba NULL</text>
<text x="1200" y="1507" font-size="13">lub oba podane, a termin zwrotu</text>
<text x="1200" y="1526" font-size="13">późniejszy od daty odbioru.</text>
<text x="40" y="1575" font-size="14">po_terminie jest właściwością Pythona, nie kolumną. PROTECT to reguła usuwania w ORM Django.</text>
</svg>