<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1097" viewBox="0 0 1280 1097" role="img" aria-labelledby="title desc">
<title id="title">Przepływ działań użytkownika</title>
<desc id="desc">Odbiór i zwrot odbywają się w bibliotece; w systemie potwierdza je bibliotekarka.</desc>
<rect width="1280" height="1097" fill="#fff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#166534"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#000} .edge{fill:none;stroke:#166534;stroke-width:2;marker-end:url(#arrow)} .label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
<text x="40" y="45" font-size="26" font-weight="bold">Przepływ działań użytkownika</text>
<text x="40" y="77" font-size="15">Odbiór i zwrot odbywają się w bibliotece; w systemie potwierdza je bibliotekarka.</text>
<polyline class="edge" points="300.0,177 300.0,250"/>
<polyline class="edge" points="550,278.5 800,291.0"/>
<text class="label" x="683.0" y="276.75">Brak konta / sesji</text>
<polyline class="edge" points="300.0,307 300.0,400"/>
<text class="label" x="308.0" y="345.5">Zalogowany</text>
<polyline class="edge" points="550,428.5 800,441.0"/>
<text class="label" x="683.0" y="426.75">Niepowodzenie</text>
<polyline class="edge" points="300.0,457 300.0,550"/>
<text class="label" x="308.0" y="495.5">Sukces</text>
<polyline class="edge" points="550,591.0 800,591.0"/>
