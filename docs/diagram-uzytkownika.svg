<rect x="800" y="890" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="918" font-size="16" font-weight="bold" text-anchor="middle">Wylogowanie</text>
<text x="1005.0" y="943" font-size="16" font-weight="normal" text-anchor="middle">Dostępne w nawigacji</text>
<text x="40" y="1037" font-size="15" font-weight="normal" text-anchor="start">Panel pokazuje aktualne rezerwacje, odebrane książki, przekroczenie terminu i historię.</text>
</svg>