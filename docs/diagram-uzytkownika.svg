<polyline class="edge" points="300.0,632 300.0,720"/>
<text class="label" x="308.0" y="668.0">Odbiór</text>
<polyline class="edge" points="300.0,802 300.0,890"/>
<text class="label" x="308.0" y="838.0">Zwrot</text>
<polyline class="edge" points="550,931.0 800,931.0"/>
<rect x="50" y="120" width="500" height="57" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="148" font-size="16" font-weight="bold" text-anchor="middle">Katalog: wyszukiwanie i filtrowanie</text>
<rect x="50" y="250" width="500" height="57" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="278" font-size="16" font-weight="bold" text-anchor="middle">Szczegóły książki i dostępność</text>
<rect x="800" y="250" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="278" font-size="16" font-weight="bold" text-anchor="middle">Logowanie lub rejestracja</text>
<text x="1005.0" y="303" font-size="16" font-weight="normal" text-anchor="middle">Jeśli użytkownik nie jest zalogowany</text>
<rect x="50" y="400" width="500" height="57" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="428" font-size="16" font-weight="bold" text-anchor="middle">Próba rezerwacji po zalogowaniu</text>
<rect x="800" y="400" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="428" font-size="16" font-weight="bold" text-anchor="middle">Odmowa z podaniem przyczyny</text>
<text x="1005.0" y="453" font-size="16" font-weight="normal" text-anchor="middle">Powrót do katalogu</text>
<rect x="50" y="550" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="578" font-size="16" font-weight="bold" text-anchor="middle">Panel: OCZEKUJACA</text>
<text x="300.0" y="603" font-size="16" font-weight="normal" text-anchor="middle">Odbiór w ciągu 48 godzin</text>
<rect x="800" y="550" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="578" font-size="16" font-weight="bold" text-anchor="middle">Anulowanie lub brak odbioru</text>
<text x="1005.0" y="603" font-size="16" font-weight="normal" text-anchor="middle">Historia rezerwacji</text>
<rect x="50" y="720" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="748" font-size="16" font-weight="bold" text-anchor="middle">Odbiór książki w bibliotece</text>
<text x="300.0" y="773" font-size="16" font-weight="normal" text-anchor="middle">Panel pokazuje termin zwrotu</text>
<rect x="50" y="890" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="918" font-size="16" font-weight="bold" text-anchor="middle">Zwrot książki w bibliotece</text>
