<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="857" viewBox="0 0 1280 857" role="img" aria-labelledby="title desc">
<title id="title">Książka i jej egzemplarze</title>
<desc id="desc">Książka opisuje tytuł. Każdy egzemplarz ma własny numer i bieżącą dostępność.</desc>
<rect width="1280" height="857" fill="#fff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#166534"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#000} .edge{fill:none;stroke:#166534;stroke-width:2;marker-end:url(#arrow)} .label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
<text x="40" y="45" font-size="26" font-weight="bold">Książka i jej egzemplarze</text>
<text x="40" y="77" font-size="15">Książka opisuje tytuł. Każdy egzemplarz ma własny numer i bieżącą dostępność.</text>
<polyline class="edge" points="490,181.0 770,181.0"/>
<text class="label" x="638.0" y="173.0">1 : N</text>
<polyline class="edge" points="270.0,222 270.0,351.0 770,351.0"/>
<polyline class="edge" points="270.0,222 270.0,521.0 770,521.0"/>
<polyline class="edge" points="270.0,222 270.0,691.0 770,691.0"/>
<rect x="50" y="140" width="440" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="270.0" y="168" font-size="16" font-weight="bold" text-anchor="middle">KSIAZKA</text>
<text x="270.0" y="193" font-size="16" font-weight="normal" text-anchor="middle">Przykładowy tytuł</text>
<rect x="770" y="140" width="450" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="995.0" y="168" font-size="16" font-weight="bold" text-anchor="middle">Egzemplarz 001 · wolny</text>
<text x="995.0" y="193" font-size="16" font-weight="normal" text-anchor="middle">aktywny=True · dostepny=True</text>
<rect x="770" y="310" width="450" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="995.0" y="338" font-size="16" font-weight="bold" text-anchor="middle">Egzemplarz 002 · czeka na odbiór</text>
<text x="995.0" y="363" font-size="16" font-weight="normal" text-anchor="middle">aktywny=True · dostepny=False</text>
<rect x="770" y="480" width="450" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="995.0" y="508" font-size="16" font-weight="bold" text-anchor="middle">Egzemplarz 003 · odebrany</text>
<text x="995.0" y="533" font-size="16" font-weight="normal" text-anchor="middle">aktywny=True · dostepny=False</text>
<rect x="770" y="650" width="450" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="995.0" y="678" font-size="16" font-weight="bold" text-anchor="middle">Egzemplarz 004 · wycofany i wolny</text>
<text x="995.0" y="703" font-size="16" font-weight="normal" text-anchor="middle">aktywny=False · dostepny=True</text>
<text x="40" y="797" font-size="15" font-weight="normal" text-anchor="start">Do nowej rezerwacji wymagamy jednocześnie aktywny=True i dostepny=True.</text>
</svg>