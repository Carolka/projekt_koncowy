<text x="1220.0" y="852" font-size="16" font-weight="normal" text-anchor="middle">Serwis sprawdza uprawnienia i stan</text>
<line class="arrow" x1="390" y1="826" x2="530" y2="826"/>
<line class="arrow" x1="885" y1="826" x2="1025" y2="826"/>
<text x="35" y="920" font-size="19" font-weight="bold" text-anchor="start">Uprawnienia rezerwacji</text>
<text x="35" y="953" font-size="16" font-weight="normal" text-anchor="start">reservations.view_rezerwacja — podgląd wszystkich rezerwacji</text>
<text x="35" y="981" font-size="16" font-weight="normal" text-anchor="start">reservations.cancel_reservation — anulowanie cudzych rezerwacji oczekujących</text>
<text x="35" y="1009" font-size="16" font-weight="normal" text-anchor="start">reservations.collect_reservation — potwierdzanie odbioru</text>
<text x="35" y="1037" font-size="16" font-weight="normal" text-anchor="start">reservations.return_reservation — potwierdzanie zwrotu</text>
<text x="35" y="1080" font-size="16" font-weight="normal" text-anchor="start">Przydział egzemplarza, zmiana statusu i dostępności odbywają się przez serwisy, a nie ręczną edycję.</text>
<text x="35" y="1110" font-size="16" font-weight="normal" text-anchor="start">Rezerwacje w adminie: odczyt i dozwolone akcje; bez formularza ręcznego tworzenia lub usuwania.</text>
<text x="35" y="1140" font-size="16" font-weight="normal" text-anchor="start">Każda operacja zmieniająca dane: POST i CSRF. Brak uprawnienia lub niedozwolony stan oznacza odmowę.</text>
