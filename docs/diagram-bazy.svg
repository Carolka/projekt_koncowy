<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1290" viewBox="0 0 1220 1290" role="img" aria-labelledby="title desc">
<title id="title">Diagram bazy danych biblioteki</title>
<desc id="desc">Modele użytkownika, autora, gatunku, książki, egzemplarza i rezerwacji. Czarny tekst na jasnym tle.</desc>
<rect width="1220" height="1290" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#000} .field{font-size:15px}.label{font-size:15px;font-weight:bold;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}.edge{fill:none;stroke:#166534;stroke-width:2}</style>
<polyline class="edge" points="340,125 430,125"/>
<text class="label" x="385" y="112" text-anchor="middle">N : M</text>
<polyline class="edge" points="770,125 870,125"/>
<text class="label" x="820" y="112" text-anchor="middle">M : N</text>
<polyline class="edge" points="600,254 600,390"/>
<text class="label" x="600" y="327" text-anchor="middle">1 : N</text>
<polyline class="edge" points="600,604 600,675 940,675 940,740"/>
<text class="label" x="835" y="663" text-anchor="middle">1 : N — historia egzemplarza</text>
<polyline class="edge" points="380,860 710,860"/>
<text class="label" x="545" y="846" text-anchor="middle">1 : N — rezerwacje użytkownika</text>
