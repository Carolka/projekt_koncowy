<rect x="711" y="852" width="458" height="34" fill="#ffffff"/>
<text class="field" x="722" y="875">egzemplarz_id : bigint [FK]</text>
<rect x="711" y="886" width="458" height="34" fill="#f0f7f2"/>
<text class="field" x="722" y="909">status : varchar(20)</text>
<rect x="711" y="920" width="458" height="34" fill="#ffffff"/>
<text class="field" x="722" y="943">utworzona_at : datetime</text>
<rect x="711" y="954" width="458" height="34" fill="#f0f7f2"/>
<text class="field" x="722" y="977">termin_odbioru : datetime</text>
<rect x="711" y="988" width="458" height="34" fill="#ffffff"/>
<text class="field" x="722" y="1011">odebrana_at : datetime [NULL]</text>
<rect x="711" y="1022" width="458" height="34" fill="#f0f7f2"/>
<text class="field" x="722" y="1045">termin_zwrotu : datetime [NULL]</text>
<rect x="711" y="1056" width="458" height="34" fill="#ffffff"/>
<text class="field" x="722" y="1079">anulowana_at : datetime [NULL]</text>
<rect x="711" y="1090" width="458" height="34" fill="#f0f7f2"/>
<text class="field" x="722" y="1113">zwrocona_at : datetime [NULL]</text>
<text x="40" y="1170" font-size="16" font-weight="bold">PK — klucz główny · FK — klucz obcy · UK — unikalność · NULL — pole opcjonalne</text>
<text x="40" y="1200" font-size="15">Relacje N:M realizują automatyczne tabele pośrednie Django (niepokazane).</text>
<text x="40" y="1226" font-size="15">Egzemplarz: najwyżej jedna rezerwacja OCZEKUJACA lub ODEBRANA jednocześnie.</text>
<text x="40" y="1252" font-size="15">USER: pokazano wybrane pola; bibliotekarka to użytkownik z grupą i uprawnieniami.</text>
</svg>