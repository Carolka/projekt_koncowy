<rect x="41" y="784" width="338" height="34" fill="#ffffff"/>
<text class="field" x="52" y="807">id : integer [PK]</text>
<rect x="41" y="818" width="338" height="34" fill="#f0f7f2"/>
<text class="field" x="52" y="841">username : varchar(150) [UK]</text>
<rect x="41" y="852" width="338" height="34" fill="#ffffff"/>
<text class="field" x="52" y="875">password : varchar(128), hash</text>
<rect x="41" y="886" width="338" height="34" fill="#f0f7f2"/>
<text class="field" x="52" y="909">is_active : boolean</text>
<rect x="41" y="920" width="338" height="34" fill="#ffffff"/>
<text class="field" x="52" y="943">is_staff : boolean</text>
<rect x="41" y="954" width="338" height="34" fill="#f0f7f2"/>
<text class="field" x="52" y="977">is_superuser : boolean</text>
<rect x="710" y="740" width="460" height="384" fill="white" stroke="#166534" stroke-width="2"/>
<rect x="711" y="741" width="458" height="42" fill="#d1e7d7"/>
<text x="940.0" y="768" text-anchor="middle" font-size="17" font-weight="bold">REZERWACJA</text>
