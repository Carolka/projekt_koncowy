<polyline class="edge" points="300.0,802 300.0,890"/>
<text class="label" x="308.0" y="838.0">Zwrot</text>
<rect x="50" y="120" width="500" height="57" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="148" font-size="16" font-weight="bold" text-anchor="middle">Logowanie i kontrola uprawnień</text>
<rect x="50" y="250" width="500" height="57" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="278" font-size="16" font-weight="bold" text-anchor="middle">Panel bibliotekarki</text>
<rect x="800" y="250" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="278" font-size="16" font-weight="bold" text-anchor="middle">Django admin</text>
<text x="1005.0" y="303" font-size="16" font-weight="normal" text-anchor="middle">Katalog i egzemplarze</text>
<rect x="50" y="400" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="428" font-size="16" font-weight="bold" text-anchor="middle">Lista rezerwacji</text>
<text x="300.0" y="453" font-size="16" font-weight="normal" text-anchor="middle">Wyszukiwanie i filtry</text>
<rect x="50" y="550" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="578" font-size="16" font-weight="bold" text-anchor="middle">OCZEKUJACA</text>
<text x="300.0" y="603" font-size="16" font-weight="normal" text-anchor="middle">Sprawdzenie terminu odbioru</text>
<rect x="800" y="400" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="428" font-size="16" font-weight="bold" text-anchor="middle">Historia: ANULOWANA</text>
<text x="1005.0" y="453" font-size="16" font-weight="normal" text-anchor="middle">WYGASLA / ZAKONCZONA</text>
<rect x="800" y="550" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="1005.0" y="578" font-size="16" font-weight="bold" text-anchor="middle">Termin odbioru minął</text>
<text x="1005.0" y="603" font-size="16" font-weight="normal" text-anchor="middle">System wygasza rezerwację</text>
<rect x="50" y="720" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="748" font-size="16" font-weight="bold" text-anchor="middle">Odbiór przed terminem</text>
<text x="300.0" y="773" font-size="16" font-weight="normal" text-anchor="middle">ODEBRANA · 14 dni na zwrot</text>
<rect x="800" y="720" width="410" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
