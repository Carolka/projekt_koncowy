<text x="1005.0" y="773" font-size="16" font-weight="normal" text-anchor="middle">ANULOWANA · zwolnienie egzemplarza</text>
<rect x="50" y="890" width="500" height="82" rx="7" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
<text x="300.0" y="918" font-size="16" font-weight="bold" text-anchor="middle">Potwierdzenie faktycznego zwrotu</text>
<text x="300.0" y="943" font-size="16" font-weight="normal" text-anchor="middle">ZAKONCZONA · zwolnienie egzemplarza</text>
<text x="40" y="1037" font-size="15" font-weight="normal" text-anchor="start">Odebraną rezerwację można również wybrać bezpośrednio z listy. Po terminie książka pozostaje zajęta.</text>
</svg>
