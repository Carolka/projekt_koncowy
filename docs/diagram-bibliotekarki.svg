<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1097" viewBox="0 0 1280 1097" role="img" aria-labelledby="title desc">
<title id="title">Przepływ pracy bibliotekarki</title>
<desc id="desc">Dostęp i każda operacja wymagają odpowiednich uprawnień.</desc>
<rect width="1280" height="1097" fill="#fff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#166534"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#000} .edge{fill:none;stroke:#166534;stroke-width:2;marker-end:url(#arrow)} .label{font-size:14px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
<text x="40" y="45" font-size="26" font-weight="bold">Przepływ pracy bibliotekarki</text>
<text x="40" y="77" font-size="15">Dostęp i każda operacja wymagają odpowiednich uprawnień.</text>
