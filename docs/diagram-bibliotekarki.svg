<polyline class="edge" points="550,278.5 800,291.0"/>
<text class="label" x="683.0" y="276.75">Katalog</text>
<polyline class="edge" points="300.0,307 300.0,400"/>
<text class="label" x="308.0" y="345.5">Rezerwacje</text>
